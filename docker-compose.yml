version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ph-map-population-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      # Do not overwrite the built assets if running locally
      - public-build:/var/www/public/build
      - vendor:/var/www/vendor
      - node-modules:/var/www/node_modules
      - bootstrap-cache:/var/www/bootstrap/cache
    networks:
      - app-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - public-build:/var/www/public/build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

networks:
  app-network:
    driver: bridge

volumes:
  public-build:
  vendor:
  node-modules:
  bootstrap-cache:
